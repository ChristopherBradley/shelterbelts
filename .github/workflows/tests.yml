name: Tests

on:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false  # One platform failing should not hide the others.
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            environment-file: environment.yml
          - name: macos-arm
            os: macos-latest
            environment-file: environment.yml
          - name: macos-intel
            os: macos-15-intel
            environment-file: environment.yml
          # conda-forge has no win-64 tensorflow, so Windows takes it from pip.
          - name: windows
            os: windows-latest
            environment-file: environment-windows.yml

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: ${{ matrix.environment-file }}
          activate-environment: shelterbelts
          miniforge-version: latest

      - name: Run pytest
        shell: bash -l {0}
        run: pytest tests/ --durations=15
