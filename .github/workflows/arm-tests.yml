name: ARM Tests (experiment)

# Apple Silicon only, so a run takes a few minutes instead of waiting on every
# other operating system. Temporary, while the pdal/tensorflow interaction on
# macos-latest is being pinned down.

# Runs on every push to this branch: workflow_dispatch would only be dispatchable
# once the file reaches the default branch, which it should not until it works.
on:
  push:
    branches:
      - claude

concurrency:
  group: arm-tests
  cancel-in-progress: true

jobs:
  deadlock:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: shelterbelts
          miniforge-version: latest

      # Importing tensorflow first is now known to fix this, but that only helps
      # code that remembers to do it. conda-forge's pdal metapackage drags in a
      # pile of optional plugin dylibs (tiledb, draco, e57, cpd...) that this repo
      # never uses, and one of those bringing its own threadpool would explain the
      # clash. If skipping plugin loading is enough, dropping the metapackage is a
      # cleaner fix than an import-order rule.
      - name: Are pdal's optional plugins the trigger
        shell: bash -l {0}
        timeout-minutes: 15
        run: |
          set +e
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import faulthandler, sys, time
          faulthandler.dump_traceback_later(60, exit=True)
          import numpy as np
          t = time.time(); import pdal
          print(f"  imported pdal {time.time()-t:.1f}s  drivers={len(pdal.drivers.__dict__)}", flush=True)
          from tensorflow import keras
          m = keras.Sequential([keras.Input(shape=(4,)),
                                keras.layers.Dense(8, activation="relu"),
                                keras.layers.Dense(2)])
          m.compile(optimizer="adam", loss="mse")
          x = np.random.rand(20000, 4).astype("float32")
          t = time.time(); m.predict(x, verbose=0)
          print(f"  predict OK {time.time()-t:.1f}s", flush=True)
          PY
          echo "=== pdal first, all plugins (control, expected to hang) ==="
          python "$RUNNER_TEMP/probe.py" > "$RUNNER_TEMP/a.log" 2>&1; echo "  rc=$?"
          grep -E "OK|Timeout|drivers=" "$RUNNER_TEMP/a.log" | head -3
          echo "=== pdal first, PDAL_DRIVER_PATH pointed away from the plugins ==="
          PDAL_DRIVER_PATH="$RUNNER_TEMP/no-plugins" python "$RUNNER_TEMP/probe.py" > "$RUNNER_TEMP/b.log" 2>&1; echo "  rc=$?"
          grep -E "OK|Timeout|drivers=" "$RUNNER_TEMP/b.log" | head -3

      # The actual goal: does the whole suite pass now, and how long does it take.
      - name: Run pytest
        if: always()
        shell: bash -l {0}
        timeout-minutes: 25
        run: pytest tests/ -v --durations=15 -o faulthandler_timeout=300
