name: ARM Tests (experiment)

# Apple Silicon only, so a run takes a few minutes instead of waiting on every
# other operating system. Temporary, for working out why pdal and tensorflow
# segfault when imported into the same process on macos-latest.

# Runs on every push to this branch: workflow_dispatch would only be dispatchable
# once the file reaches the default branch, which it should not until it works.
on:
  push:
    branches:
      - claude

# A new push supersedes whatever is still running for this branch.
concurrency:
  group: arm-tests
  cancel-in-progress: true

jobs:
  conda-tensorflow:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Add tensorflow to the conda dependencies
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("environment.yml")
          t = p.read_text()
          assert "\n  - pip\n" in t, t
          p.write_text(t.replace("\n  - pip\n", "\n  - tensorflow\n  - pip\n"))
          print(p.read_text())
          PY

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: shelterbelts
          miniforge-version: latest

      # Cheap regression check on the actual cause: pdal links conda-forge's
      # libc++ and the tensorflow pip wheel links the system one, so whichever
      # loaded second used to segfault. Both orders should survive now that
      # tensorflow comes from conda-forge and shares pdal's C++ runtime.
      - name: Import order matrix
        shell: bash -l {0}
        timeout-minutes: 5
        run: |
          SP=$(python -c "import site; print(site.getsitepackages()[0])")
          python -c "import tensorflow as tf; print('tensorflow', tf.__version__)"
          otool -L "$SP"/pdal/libpdalpython*.so | grep -iE "c\+\+" || true
          probe () {
            python -c "$1" >/dev/null 2>&1
            echo "exit=$?  <-  $1"
          }
          probe "import pdal, tensorflow"
          probe "import tensorflow, pdal"

      # Split so a slow network test cannot hide a slow classification test.
      # --durations names the offenders, which in-progress logs will not show.
      - name: pytest (no network)
        shell: bash -l {0}
        timeout-minutes: 20
        run: pytest tests/ --ignore=tests/test_apis -v --durations=0

      - name: pytest (apis, network bound)
        if: always()
        shell: bash -l {0}
        timeout-minutes: 20
        run: pytest tests/test_apis -v --durations=0
