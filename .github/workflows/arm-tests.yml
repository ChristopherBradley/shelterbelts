name: ARM Tests (experiment)

# Apple Silicon only, so a run takes a few minutes instead of waiting on every
# other operating system. Temporary, while the remaining tensorflow failure on
# macos-latest is being pinned down.

# Runs on every push to this branch: workflow_dispatch would only be dispatchable
# once the file reaches the default branch, which it should not until it works.
on:
  push:
    branches:
      - claude

concurrency:
  group: arm-tests
  cancel-in-progress: true

jobs:
  training-abort:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: shelterbelts
          miniforge-version: latest

      # keras fit aborts on both macs with conda-forge tensorflow:
      #   Assertion failed: (f == nullptr || dynamic_cast<To>(f) != nullptr),
      #   function down_cast, file external/local_xla/xla/tsl/platform/default/casts.h
      # which is a debug assertion the conda-forge macOS build ships enabled. It
      # only fires when a metric is attached, so look for a spelling that avoids
      # it. Each variant runs in its own process so one abort does not take the
      # rest with it.
      - name: Which metric spelling avoids the assertion
        shell: bash -l {0}
        timeout-minutes: 15
        run: |
          set +e
          cat > "$RUNNER_TEMP/nn.py" <<'PY'
          import faulthandler, sys, time
          faulthandler.dump_traceback_later(120, exit=True)
          import numpy as np
          from tensorflow import keras

          variant = sys.argv[1]
          rng = np.random.default_rng(0)
          X_train = rng.random((2000, 12)).astype("float32")
          X_test = rng.random((500, 12)).astype("float32")
          y_train = keras.utils.to_categorical(rng.integers(0, 2, 2000), 2)
          y_test = keras.utils.to_categorical(rng.integers(0, 2, 500), 2)

          model = keras.Sequential([
              keras.layers.Dense(256, activation='relu'), keras.layers.Dropout(0.1),
              keras.layers.Dense(128, activation='relu'), keras.layers.Dropout(0.1),
              keras.layers.Dense(64, activation='relu'), keras.layers.Dropout(0.1),
              keras.layers.Dense(2, activation='softmax'),
          ])
          # The metric is what fires conda-forge's leftover debug assertion in
          # tsl's down_cast. Look for a spelling of "report accuracy per epoch"
          # that avoids it, so the training curves can still be plotted.
          compile_kw = dict(optimizer=keras.optimizers.Adam(learning_rate=0.001),
                            loss='CategoricalCrossentropy')
          kw = dict(validation_data=(X_test, y_test))
          if variant == "metric_string":
              compile_kw["metrics"] = ['CategoricalAccuracy']
          elif variant == "metric_instance":
              compile_kw["metrics"] = [keras.metrics.CategoricalAccuracy()]
          elif variant == "metric_accuracy":
              compile_kw["metrics"] = ['accuracy']
          elif variant == "run_eagerly":
              compile_kw["metrics"] = ['CategoricalAccuracy']
              compile_kw["run_eagerly"] = True
          elif variant == "jit_false":
              compile_kw["metrics"] = ['CategoricalAccuracy']
              compile_kw["jit_compile"] = False

          model.compile(**compile_kw)
          t = time.time()
          model.fit(X_train, y_train, epochs=2, batch_size=32, verbose=0, **kw)
          print(f"  {variant} OK {time.time()-t:.1f}s", flush=True)
          PY
          for v in metric_instance metric_accuracy run_eagerly jit_false metric_string; do
            echo "=== $v ==="
            TF_CPP_MIN_LOG_LEVEL=0 python "$RUNNER_TEMP/nn.py" "$v" > "$RUNNER_TEMP/$v.log" 2>&1
            echo "  rc=$?"
            grep -viE "^\s*$|oneDNN|TF-TRT|cpu_feature" "$RUNNER_TEMP/$v.log" | tail -5
          done
