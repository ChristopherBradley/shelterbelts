name: ARM Tests (experiment)

# Apple Silicon only, so a run takes a few minutes instead of waiting on every
# other operating system. Temporary, while the remaining tensorflow failure on
# macos-latest is being pinned down.

# Runs on every push to this branch: workflow_dispatch would only be dispatchable
# once the file reaches the default branch, which it should not until it works.
on:
  push:
    branches:
      - claude

concurrency:
  group: arm-tests
  cancel-in-progress: true

jobs:
  training-abort:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: shelterbelts
          miniforge-version: latest

      # Everything up to test_training now passes on both macs, then keras fit
      # aborts. pytest captured whatever was written before the abort, so run it
      # with -s and with tensorflow's C++ logging turned back on to see it.
      - name: test_training with output captured
        shell: bash -l {0}
        timeout-minutes: 12
        run: |
          set +e
          TF_CPP_MIN_LOG_LEVEL=0 pytest tests/test_classifications/test_training.py -v -s 2>&1 | tail -60
          echo "rc=${PIPESTATUS[0]}"

      # Narrow which part of train_model's compile/fit aborts. Each variant runs in
      # its own process so one abort does not take the rest with it.
      - name: Which part of the model aborts
        if: always()
        shell: bash -l {0}
        timeout-minutes: 15
        run: |
          set +e
          cat > "$RUNNER_TEMP/nn.py" <<'PY'
          import faulthandler, sys, time
          faulthandler.dump_traceback_later(120, exit=True)
          import numpy as np
          from tensorflow import keras

          variant = sys.argv[1]
          rng = np.random.default_rng(0)
          X_train = rng.random((2000, 12)).astype("float32")
          X_test = rng.random((500, 12)).astype("float32")
          y_train = keras.utils.to_categorical(rng.integers(0, 2, 2000), 2)
          y_test = keras.utils.to_categorical(rng.integers(0, 2, 500), 2)

          model = keras.Sequential([
              keras.layers.Dense(256, activation='relu'), keras.layers.Dropout(0.1),
              keras.layers.Dense(128, activation='relu'), keras.layers.Dropout(0.1),
              keras.layers.Dense(64, activation='relu'), keras.layers.Dropout(0.1),
              keras.layers.Dense(2, activation='softmax'),
          ])
          kw = {}
          loss, metrics = 'CategoricalCrossentropy', ['CategoricalAccuracy']
          if variant == "full":
              kw = dict(callbacks=[keras.callbacks.EarlyStopping(monitor='val_loss', patience=30,
                                                                 restore_best_weights=True)],
                        validation_data=(X_test, y_test))
          elif variant == "no_callbacks":
              kw = dict(validation_data=(X_test, y_test))
          elif variant == "no_validation":
              kw = dict()
          elif variant == "lowercase_names":
              loss, metrics = 'categorical_crossentropy', ['categorical_accuracy']
              kw = dict(validation_data=(X_test, y_test))
          elif variant == "no_metrics":
              metrics = None
              kw = dict(validation_data=(X_test, y_test))

          model.compile(optimizer=keras.optimizers.Adam(learning_rate=0.001),
                        loss=loss, metrics=metrics)
          t = time.time()
          model.fit(X_train, y_train, epochs=2, batch_size=32, verbose=0, **kw)
          print(f"  {variant} OK {time.time()-t:.1f}s", flush=True)
          PY
          for v in no_validation no_metrics lowercase_names no_callbacks full; do
            echo "=== $v ==="
            TF_CPP_MIN_LOG_LEVEL=0 python "$RUNNER_TEMP/nn.py" "$v" > "$RUNNER_TEMP/$v.log" 2>&1
            echo "  rc=$?"
            grep -viE "^\s*$|oneDNN|TF-TRT|cpu_feature" "$RUNNER_TEMP/$v.log" | tail -5
          done
