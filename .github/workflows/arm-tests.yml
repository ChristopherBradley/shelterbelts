name: ARM Tests (experiment)

# Apple Silicon only, so a run takes a few minutes instead of waiting on every
# other operating system. Temporary, for working out why keras deadlocks on
# macos-latest once the pdal/tensorflow segfault is out of the way.

# Runs on every push to this branch: workflow_dispatch would only be dispatchable
# once the file reaches the default branch, which it should not until it works.
on:
  push:
    branches:
      - claude

concurrency:
  group: arm-tests
  cancel-in-progress: true

jobs:
  deadlock:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: shelterbelts
          miniforge-version: latest

      # model.predict() hangs in tf.data's iterator_get_next, but only in the code
      # path that has already imported pdal - the same stock predict ran in 0.1s
      # without it. These probes separate the two, and check whether calling the
      # model directly (no tf.data involved) sidesteps it. Each runs in its own
      # process and self-aborts after 90s, so one hang does not eat the whole job.
      - name: Where does keras deadlock
        shell: bash -l {0}
        timeout-minutes: 20
        run: |
          set +e   # a probe that deadlocks must not abort the remaining probes
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import faulthandler, sys, time
          faulthandler.dump_traceback_later(60, exit=True)
          mode = sys.argv[1]
          if "pdal" in mode:
              t = time.time(); import pdal; print(f"  imported pdal {time.time()-t:.1f}s", flush=True)
          import numpy as np
          import tensorflow as tf
          from tensorflow import keras
          if "serial" in mode:
              tf.config.threading.set_inter_op_parallelism_threads(1)
              tf.config.threading.set_intra_op_parallelism_threads(1)
          m = keras.Sequential([keras.Input(shape=(4,)),
                                keras.layers.Dense(8, activation="relu"),
                                keras.layers.Dense(2)])
          m.compile(optimizer="adam", loss="mse")
          x = np.random.rand(20000, 4).astype("float32")
          y = np.random.rand(20000, 2).astype("float32")
          if "fit" in mode:
              t = time.time(); m.fit(x, y, epochs=1, verbose=0); print(f"  fit OK {time.time()-t:.1f}s", flush=True)
          if "predict" in mode:
              t = time.time(); m.predict(x, verbose=0); print(f"  predict OK {time.time()-t:.1f}s", flush=True)
          if "direct" in mode:
              t = time.time()
              out = np.concatenate([m(x[i:i+8192], training=False).numpy()
                                    for i in range(0, len(x), 8192)])
              print(f"  direct call OK {time.time()-t:.1f}s shape={out.shape}", flush=True)
          PY
          for mode in pdal-direct pdal-fit pdal-predict-serial pdal-predict; do
            echo "=== $mode ==="
            python "$RUNNER_TEMP/probe.py" "$mode" > "$RUNNER_TEMP/$mode.log" 2>&1
            echo "  rc=$?"
            grep -E "OK|Timeout|Error" "$RUNNER_TEMP/$mode.log" | head -4
          done
