name: ARM Tests (experiment)

# Apple Silicon only, so a run takes a few minutes instead of waiting on every
# other operating system. Temporary, while the remaining tensorflow failure on
# macos-latest is being pinned down.

# Runs on every push to this branch: workflow_dispatch would only be dispatchable
# once the file reaches the default branch, which it should not until it works.
on:
  push:
    branches:
      - claude

concurrency:
  group: arm-tests
  cancel-in-progress: true

jobs:
  # conda-forge's macOS tensorflow 2.19.1 aborts as soon as a metric is attached
  # to compile, on a debug assertion a release build would not have:
  #   Assertion failed: (f == nullptr || dynamic_cast<To>(f) != nullptr),
  #   function down_cast, .../xla/tsl/platform/default/casts.h
  # Linux ships the identical tensorflow 2.19.1 and keras 3.15.1 and passes all
  # 120 tests, so the assertion is enabled only in the macOS builds. Both macOS
  # arches also carry 2.16.1, 2.17.0 and 2.18.0, and so does Linux, so a shared
  # version pin would fix macOS without reshaping the model code.
  #
  # Solving each version into its own env in parallel, rather than downgrading an
  # existing env - mamba took 28 minutes to walk 2.19.1 back to 2.18.0.
  tensorflow-version:
    name: tensorflow ${{ matrix.tensorflow }}
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        tensorflow: ['2.18.0', '2.17.0', '2.16.1']
    steps:
      - uses: actions/checkout@v4

      - name: Pin tensorflow to ${{ matrix.tensorflow }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          v = os.environ["TF_VERSION"]
          p = pathlib.Path("environment.yml")
          t = p.read_text()
          assert "\n  - tensorflow\n" in t, t
          p.write_text(t.replace("\n  - tensorflow\n", f"\n  - tensorflow={v}\n"))
          PY
        env:
          TF_VERSION: ${{ matrix.tensorflow }}

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: shelterbelts
          miniforge-version: latest

      - name: Train with a metric attached
        shell: bash -l {0}
        timeout-minutes: 12
        run: |
          set +e
          cat > "$RUNNER_TEMP/nn.py" <<'PY'
          import faulthandler, time
          faulthandler.dump_traceback_later(180, exit=True)
          import numpy as np
          import tensorflow as tf
          from tensorflow import keras
          import keras as keras_pkg
          print(f"  tensorflow {tf.__version__} / keras {keras_pkg.__version__}", flush=True)
          rng = np.random.default_rng(0)
          X = rng.random((2000, 12)).astype("float32")
          Xv = rng.random((500, 12)).astype("float32")
          y = keras.utils.to_categorical(rng.integers(0, 2, 2000), 2)
          yv = keras.utils.to_categorical(rng.integers(0, 2, 500), 2)
          model = keras.Sequential([
              keras.layers.Dense(256, activation='relu'), keras.layers.Dropout(0.1),
              keras.layers.Dense(128, activation='relu'), keras.layers.Dropout(0.1),
              keras.layers.Dense(64, activation='relu'), keras.layers.Dropout(0.1),
              keras.layers.Dense(2, activation='softmax'),
          ])
          model.compile(optimizer=keras.optimizers.Adam(learning_rate=0.001),
                        loss='CategoricalCrossentropy', metrics=['CategoricalAccuracy'])
          t = time.time()
          h = model.fit(X, y, epochs=2, batch_size=32, verbose=0,
                        validation_data=(Xv, yv),
                        callbacks=[keras.callbacks.EarlyStopping(monitor='val_loss', patience=30,
                                                                 restore_best_weights=True)])
          print(f"  fit with metric OK {time.time()-t:.1f}s  history={sorted(h.history)}", flush=True)
          PY
          TF_CPP_MIN_LOG_LEVEL=0 python "$RUNNER_TEMP/nn.py" > "$RUNNER_TEMP/out.log" 2>&1
          echo "rc=$?"
          grep -E "tensorflow [0-9]|OK |Assertion failed|Timeout|Error" "$RUNNER_TEMP/out.log" | head -4

      # Only meaningful if the probe above survived, but always worth the log.
      - name: Run pytest
        if: always()
        shell: bash -l {0}
        timeout-minutes: 20
        run: pytest tests/ --durations=15
