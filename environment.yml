name: shelterbelts
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pdal  # Used for lidar processing
  - python-pdal
  - pandoc    # Markdown to PDF conversion for the JOSS paper
  - tectonic  # LaTeX engine for compiling the JOSS paper to PDF
  - rasterio
  - numba  # Install with conda (pulls a prebuilt llvmlite) so pip doesn't build from source (needs LLVM)
  # Must come from conda-forge rather than the pip wheel. The wheel links the system
  # libc++ while python-pdal links conda-forge's, and on macOS the two C++ runtimes
  # cannot share a process - whichever gets imported second segfaults. conda-forge
  # has no Windows build of tensorflow, so Windows uses environment-windows.yml.
  - tensorflow
  - pip
  - pip:
      - -e .[dev]